name: Validate Locale Files

on:
  push:

jobs:
  validate:
    name: Validate all locale YAML files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run locale validation (all files)
        run: python .github/scripts/validate_locales.py
