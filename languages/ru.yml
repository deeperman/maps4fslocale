# languages/ru.yml

meta:
  code: ru
  full: Russian
  localized: Русский

main_settings:
  label: Основные настройки
  tooltip: Основные параметры генерации карты
  fields:
    game:
      label: Игра
      tooltip: "Целевая версия FS. Примечание: поддержка FS22 прекращена — для лучших результатов используйте FS25."
    coordinates:
      label: Координаты
      tooltip: Широта и долгота центра карты, через запятую или пробел (например, 45.28, 20.23). Только десятичный формат.
    size:
      label: Размер карты
      tooltip: "Размер карты в метрах. Внимание: карты размером 16 км могут превышать ограничения движка FS25 и вызывать сбои в Giants Editor."
    output_size:
      label: Выходной размер
      tooltip: "Масштабирование большой реальной области в меньший совместимый размер карты (например, регион 3000 м → выходной размер 2048 м)."
    rotation:
      label: Поворот
      tooltip: "Поворачивает карту на −90–90°. Равномерно влияет на рельеф и все географические объекты."
    dtm_provider:
      label: Источник данных DTM
      tooltip: Источник данных о высотах. Региональные источники предлагают более высокое разрешение, чем глобальные — выберите лучший доступный для вашей области.
    main_settings_preset:
      label: Пресет основных настроек
      tooltip: "Предопределённые конфигурации с вашими настройками. Экономьте время, повторно используя предпочтительные настройки для разных карт или тестовых сценариев."
    custom_osm:
      label: Пользовательский файл OSM
      tooltip: "Используйте свой файл .osm вместо загрузки из OSM API."
    custom_dem:
      label: Пользовательский файл DEM
      tooltip: "Используйте свой файл .png DEM вместо загрузки из источника DTM. Должен быть одноканальным 16‑битным PNG в градациях серого, где значения пикселей представляют высоту."
    output_directory:
      label: Выходная директория
      tooltip: "Папка, в которую будут сохранены сгенерированные файлы карты. Должна быть пустой во избежание конфликтов."

generation_settings:
  label: Настройки генерации
  tooltip: Настройки, управляющие процессом генерации карты

  generation_preset:
    label: Пресет генерации
    tooltip: "Предопределённые конфигурации генерации с вашими настройками. Экономьте время, повторно используя предпочтительные настройки для разных карт или тестовых сценариев."

  dem:
    label: DEM (модель высот)
    tooltip: Управление высотой рельефа, сглаживанием и корректировкой высот.
    fields:
      adjust_terrain_to_ground_level:
        label: Выровнять рельеф по уровню земли
        tooltip: Сдвигает весь рельеф так, чтобы самая низкая точка совпадала с уровнем земли.
      multiplier:
        label: Множитель высоты
        tooltip: Масштабирует значения высот. Более высокие значения создают более выраженный рельеф.
      plateau:
        label: Плато
        tooltip: "Добавляет базовую высоту (в метрах) ко всей карте. Полезно для плоских областей, где нужно место для отрицательных высот (например, рек)."
      ceiling:
        label: Верхний предел
        tooltip: Отступ над самой высокой точкой рельефа. Полезно, если вы планируете вручную моделировать рельеф в Giants Editor.
      water_depth:
        label: Глубина воды
        tooltip: "Вычитает указанную глубину из водных областей. Пропускайте, если используете высококачественные данные DEM — это может нарушить существующие данные о глубине."
      blur_radius:
        label: Радиус размытия
        tooltip: "Сглаживает рельеф путём размытия данных о высоте (в пикселях). Избегайте высоких значений при использовании высококачественных данных DEM — это уничтожает детали."
      minimum_height_scale:
        label: Минимальная шкала высоты
        tooltip: Минимальное значение шкалы высоты, применяемое к рельефу.
      add_foundations:
        label: Добавить фундаменты
        tooltip: Выравнивает рельеф под зданиями до их средней высоты.

  background:
    label: Фон
    tooltip: Рельеф, вода и 3D‑элементы вокруг игровой области карты.
    fields:
      generate_background:
        label: Сгенерировать фон
        tooltip: "Генерирует фоновый рельеф за пределами игровой области. FS25: также создаёт готовый к использованию файл i3d, если включены спутниковые снимки."
      generate_water:
        label: Сгенерировать воду
        tooltip: "Генерирует файлы водной плоскости. FS25: создаёт готовый к использованию файл i3d для прямого импорта в Giants Editor."
      water_blurriness:
        label: Размытость воды
        tooltip: Сглаживает поверхность водной плоскости. Слишком высокое значение может привести к тому, что водная сетка не будет совпадать с рельефом.
      remove_center:
        label: Удалить центр
        tooltip: Удаляет игровую область карты из фоновой сетки, чтобы они не перекрывались.
      flatten_roads:
        label: Выровнять дороги
        tooltip: "Выравнивает рельеф под дорогами. Не используйте с источниками DTM высокого качества — это может ухудшить результаты."
      flatten_water:
        label: Выровнять воду
        tooltip: Устанавливает одинаковую среднюю высоту для всех водных участков. Избегайте на картах с большими перепадами высот.

  grle:
    label: Сельхозугодья и растительность
    tooltip: Управление генерацией сельхозугодий, травы и распределением растительности.
    fields:
      farmland_margin:
        label: Отступ сельхозугодий
        tooltip: Расширяет каждый полигон сельхозугодий на указанное количество метров. Предотвращает обрезку краёв и проблемы в игровом процессе.
      add_farmyards:
        label: Добавить фермерские дворы
        tooltip: Создаёт сельхозугодья из областей фермерских дворов в OSM. Для них не рисуются поля или текстуры.
      base_price:
        label: Базовая цена поля
        tooltip: Базовая цена сельхозугодий в игровой валюте. На стандартных игровых картах используется значение 60 000.
      price_scale:
        label: Масштаб цены
        tooltip: Процентный множитель, применяемый к базовой цене поля.
      add_grass:
        label: Добавить траву
        tooltip: Заполняет все пустые области (без дорог, полей или зданий) травой.
      base_grass:
        label: Базовая трава
        tooltip: "Тип растения, используемый в качестве базового слоя травы. Примечание: smallDenseMix нельзя косить — выбирайте тип луга, если хотите косимую траву."
      random_plants:
        label: Случайные растения
        tooltip: Добавляет различные виды растений в пустые области. Отключите, чтобы использовать только базовую траву.
      fill_empty_farmlands:
        label: Заполнить пустые сельхозугодья
        tooltip: Заполняет сельхозугодья без определённого типа урожая слоем грунта по умолчанию.

  i3d:
    label: Объекты и сплайны
    tooltip: Деревья, плотность лесов, дорожные сплайны и номерные знаки.
    fields:
      add_trees:
        label: Добавить деревья
        tooltip: Размещает деревья в лесных областях, определённых в OSM.
      forest_density:
        label: Плотность леса
        tooltip: "Расстояние в метрах между деревьями. Меньшее значение = более густой лес. Очень низкие значения могут вызвать сбой в Giants Editor."
      tree_limit:
        label: Лимит деревьев
        tooltip: "Ограничивает общее количество деревьев путём автоматической корректировки плотности. Установите 0 для отсутствия лимита. Используйте, чтобы предотвратить сбои Giants Editor на больших картах."
      trees_relative_shift:
        label: Случайность расположения деревьев
        tooltip: Случайное смещение позиции для каждого дерева, чтобы избежать равномерной сетки.
      spline_density:
        label: Плотность сплайнов
        tooltip: Количество точек, используемых для определения дорожных сплайнов. Меньшие значения создают более гладкие, простые сплайны.
      add_reversed_splines:
        label: Добавить обратные сплайны
        tooltip: Дублирует каждый сплайн в обратном направлении для поддержки двустороннего движения по дорогам.
      field_splines:
        label: Сплайны полей
        tooltip: Генерирует сплайны вдоль границ полей.
      license_plate_prefix:
        label: Префикс номерного знака
        tooltip: "Только для FS25: региональный префикс на номерных знаках вместе с автоматически определяемым кодом страны (например, 'NS' → 'SRB NS'). Максимум 3 символа."

  texture:
    label: Текстуры
    tooltip: Раскраска текстур грунта, обнаружение полей и обработка данных OSM.
    fields:
      dissolve:
        label: Растворить границы
        tooltip: "Смешивает края слоёв текстур для более естественного вида. Медленно — включайте только для финальной генерации, а не для тестовых запусков."
      fields_padding:
        label: Отступы полей
        tooltip: Уменьшает полигоны полей на указанное количество метров. Полезно, когда поля расположены слишком близко или перекрывают друг
